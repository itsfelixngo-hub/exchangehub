# Shared by every location in the ratehubfx vhost so the three of them cannot
# drift apart. Install to /etc/nginx/snippets/ratehubfx-proxy.conf
#
# No `proxy_set_header Accept-Encoding` here on purpose: forcing it makes the
# app compress for clients that never asked, and nginx passes those bytes
# straight through.

proxy_pass http://exchangehub_backend;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
