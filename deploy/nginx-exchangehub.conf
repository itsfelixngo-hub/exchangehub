# ratehubfx.com -- nginx in front of the app, behind Cloudflare.
#
# NOTE: deploy_blue_green.sh only rewrites conf.d/exchangehub-upstream.conf
# (the blue/green port). This file is NOT deployed -- copy it to the server by
# hand, then `sudo nginx -t && sudo nginx -s reload`.
#
# The include below stays commented: Ubuntu's nginx.conf already globs
# /etc/nginx/conf.d/*.conf, so including the upstream again here is a fatal
# `duplicate upstream "exchangehub_backend"` at nginx -t.
#include /etc/nginx/conf.d/exchangehub-upstream.conf;

server {
    listen 80;
    server_name ratehubfx.com www.ratehubfx.com;

    # Left serving normally on purpose. Only switch this to
    #     return 301 https://$host$request_uri;
    # once Cloudflare's SSL mode is confirmed "Full (strict)". On "Flexible"
    # Cloudflare speaks plain HTTP to the origin and the redirect loops.
    location / {
        proxy_pass http://exchangehub_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --------------------------------------------------------------------------
# HTTPS. Cloudflare terminates TLS for visitors and re-connects here, so this
# certificate only ever has to be trusted by Cloudflare -- an Origin
# Certificate (SSL/TLS -> Origin Server -> Create Certificate) is free, lasts
# 15 years and needs no renewal job.
# --------------------------------------------------------------------------
server {
    # This form works on every nginx since 1.9.5. On 1.25.1+ it logs a
    # deprecation notice; there use `listen 443 ssl;` plus `http2 on;`.
    listen 443 ssl http2;
    server_name ratehubfx.com www.ratehubfx.com;

    ssl_certificate     /etc/ssl/cloudflare/ratehubfx.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ratehubfx.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: refuse anything that did not come through
    # Cloudflare. Without it the origin IP answers directly, which bypasses
    # the CDN and lets a caller forge X-Forwarded-For -- the contact form
    # rate limit is keyed on that header.
    # Enable "Authenticated Origin Pulls" in the dashboard FIRST, or every
    # request is answered 400. Comment both lines out to bring the site up
    # without it.
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://exchangehub_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "gzip";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
