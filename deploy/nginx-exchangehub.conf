# Small shared cache in front of the app. Pages are identical for every
# visitor, so a hit here costs no Python work at all.
proxy_cache_path /var/cache/nginx/exchangehub levels=1:2 keys_zone=exchangehub:16m
                 max_size=512m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name ratehubfx.com www.ratehubfx.com;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://exchangehub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "gzip";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache exchangehub;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 301 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $cookie_session;
        proxy_no_cache $cookie_session;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
