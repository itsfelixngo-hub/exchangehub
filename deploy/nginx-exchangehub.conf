# ratehubfx.com -- exchangehub, the second site on this VPS (alogweb is the
# first). Both share nginx on 80/443 and are separated by SNI / server_name.
#
# NOTE: deploy_blue_green.sh only rewrites conf.d/exchangehub-upstream.conf
# (the blue/green port). This file is NOT deployed -- copy it to
# /etc/nginx/sites-enabled/exchangehub.conf by hand, then
# `sudo nginx -t && sudo nginx -s reload`.
#
# The include below stays commented: Ubuntu's nginx.conf already globs
# /etc/nginx/conf.d/*.conf, so including the upstream again here is a fatal
# `duplicate upstream "exchangehub_backend"` at nginx -t.
#include /etc/nginx/conf.d/exchangehub-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name ratehubfx.com www.ratehubfx.com;

    access_log /var/log/nginx/ratehubfx.access.log;
    error_log  /var/log/nginx/ratehubfx.error.log warn;

    # Left serving normally on purpose. Only switch this to
    #     return 301 https://$host$request_uri;
    # once Cloudflare's SSL mode is confirmed "Full (strict)". On "Flexible"
    # Cloudflare speaks plain HTTP to the origin and the redirect loops.
    location / {
        proxy_pass http://exchangehub_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    # http2 is a property of the listen socket, not of the server block, so
    # this has to match what the alogweb vhost declares for the same port.
    # nginx here is 1.24; on 1.25.1+ both vhosts move to `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ratehubfx.com www.ratehubfx.com;

    access_log /var/log/nginx/ratehubfx.access.log;
    error_log  /var/log/nginx/ratehubfx.error.log warn;

    # This zone needs its own Cloudflare Origin Certificate: the alogweb one
    # in this directory covers only alogweb.com and *.alogweb.com.
    # Create at SSL/TLS -> Origin Server -> Create Certificate.
    ssl_certificate     /etc/ssl/cloudflare/ratehubfx.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ratehubfx.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ratehubfx:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: refuse anything that did not arrive through
    # Cloudflare. The origin answers on its public IP, so without this the CDN
    # can be bypassed and X-Forwarded-For forged -- the contact form rate
    # limit is keyed on that header.
    #
    # Off by default, matching the alogweb vhost. To turn it on, enable
    # "Authenticated Origin Pulls" (SSL/TLS -> Origin Server) in the dashboard
    # FIRST, fetch the CA, then uncomment both lines. Uncommenting them before
    # the dashboard toggle answers every request with 400.
    #
    #   sudo curl -fsSLo /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    #
    #ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    #ssl_verify_client      on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://exchangehub_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
