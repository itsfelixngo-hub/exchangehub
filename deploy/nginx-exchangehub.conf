# ---------------------------------------------------------------------------
# ratehubfx.com -- nginx in front of the app, behind Cloudflare.
#
# NOTE: deploy_blue_green.sh only rewrites exchangehub-upstream.conf (the
# blue/green port). This file is NOT deployed automatically -- copy it to the
# server by hand, then `sudo nginx -t && sudo nginx -s reload`.
#
# Cloudflare SSL mode must be "Full (strict)" before enabling the :80 -> :443
# redirect below. On "Flexible" Cloudflare talks to the origin over plain
# HTTP, so the redirect would bounce forever.
# ---------------------------------------------------------------------------

# Ubuntu's nginx.conf already globs /etc/nginx/conf.d/*.conf, which picks up
# the upstream file deploy_blue_green.sh writes. Including it again here is a
# "duplicate upstream" fatal at nginx -t. Uncomment only if your nginx.conf
# does NOT glob conf.d.
#include /etc/nginx/conf.d/exchangehub-upstream.conf;

# Small shared cache in front of the app. Pages are identical for every
# visitor, so a hit here costs no Python work at all.
proxy_cache_path /var/cache/nginx/exchangehub levels=1:2 keys_zone=exchangehub:16m
                 max_size=512m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name ratehubfx.com www.ratehubfx.com;

    # Cloudflare reaches the origin on 443; anything still arriving on 80 is
    # either a direct hit or a stale link.
    return 301 https://$host$request_uri;
}

server {
    # This form works on every nginx since 1.9.5. On 1.25.1+ it logs a
    # deprecation notice; there, use `listen 443 ssl;` plus `http2 on;`.
    listen 443 ssl http2;
    server_name ratehubfx.com www.ratehubfx.com;

    # Cloudflare Origin Certificate. Free, valid 15 years, trusted only by
    # Cloudflare -- which is all that is needed, since visitors terminate TLS
    # at the edge. Generate at: SSL/TLS -> Origin Server -> Create Certificate.
    ssl_certificate     /etc/ssl/cloudflare/ratehubfx.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ratehubfx.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: refuse any request that did not come from
    # Cloudflare. Without this, 139.180.142.141 can be hit directly, which
    # bypasses the CDN and lets a caller spoof X-Forwarded-For (the contact
    # form rate limit is keyed on it). Comment both lines out to test without.
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://exchangehub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "gzip";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache exchangehub;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 301 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $cookie_session;
        proxy_no_cache $cookie_session;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
