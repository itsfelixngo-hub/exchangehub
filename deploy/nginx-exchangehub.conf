# ratehubfx.com -- exchangehub, the second site on this VPS (alogweb is the
# first). Both share nginx on 80/443 and are separated by SNI / server_name.
#
# NOTE: deploy_blue_green.sh only rewrites conf.d/exchangehub-upstream.conf
# (the blue/green port). This file is NOT deployed -- copy it to
# /etc/nginx/sites-enabled/exchangehub.conf by hand, then
# `sudo nginx -t && sudo nginx -s reload`.
#
# The include below stays commented: Ubuntu's nginx.conf already globs
# /etc/nginx/conf.d/*.conf, so including the upstream again here is a fatal
# `duplicate upstream "exchangehub_backend"` at nginx -t.
#include /etc/nginx/conf.d/exchangehub-upstream.conf;

# $remote_addr is the real visitor only once deploy/cloudflare-realip.sh has
# run; before that it is a Cloudflare edge address. $request_time is what the
# visitor waited, $upstream_response_time what the app took -- the gap between
# them is nginx and the network.
# The leading fields are exactly nginx's "combined", so any tool that reads
# combined still works; the extras are appended as key=value.
#   rt  = what the visitor waited, end to end
#   urt = what the app took; the gap between the two is nginx plus network
log_format ratehubfx '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'host=$host rt=$request_time urt=$upstream_response_time';

# Rate limits are keyed on the client address, so these are only meaningful
# after cloudflare-realip.sh has run -- otherwise every visitor shares a
# handful of Cloudflare addresses and would throttle each other.
# /contact sends mail, so it is the expensive path worth protecting.
limit_req_zone $binary_remote_addr zone=ratehubfx_contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ratehubfx_api:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ratehubfx.com www.ratehubfx.com;

    access_log /var/log/nginx/ratehubfx.access.log ratehubfx;
    error_log  /var/log/nginx/ratehubfx.error.log warn;

    # Safe now that Cloudflare is on Full (strict) and reaches the origin on
    # 443. On "Flexible" this would loop forever.
    return 301 https://$host$request_uri;
}

server {
    # http2 is a property of the listen socket, not of the server block, so
    # this has to match what the alogweb vhost declares for the same port.
    # nginx here is 1.24; on 1.25.1+ both vhosts move to `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ratehubfx.com www.ratehubfx.com;

    access_log /var/log/nginx/ratehubfx.access.log ratehubfx;
    error_log  /var/log/nginx/ratehubfx.error.log warn;

    # This zone needs its own Cloudflare Origin Certificate: the alogweb one
    # in this directory covers only alogweb.com and *.alogweb.com.
    # Create at SSL/TLS -> Origin Server -> Create Certificate.
    ssl_certificate     /etc/ssl/cloudflare/ratehubfx.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ratehubfx.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ratehubfx:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: refuse anything that did not arrive through
    # Cloudflare. The origin answers on its public IP, so without this the CDN
    # can be bypassed and X-Forwarded-For forged -- the contact form rate
    # limit is keyed on that header.
    #
    # Off by default, matching the alogweb vhost. To turn it on, enable
    # "Authenticated Origin Pulls" (SSL/TLS -> Origin Server) in the dashboard
    # FIRST, fetch the CA, then uncomment both lines. Uncommenting them before
    # the dashboard toggle answers every request with 400.
    #
    #   sudo curl -fsSLo /etc/ssl/cloudflare/origin-pull-ca.pem \
    #     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    #
    #ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    #ssl_verify_client      on;

    # Sent on every response, errors included, hence "always". No CSP here:
    # the app inlines its scripts and styles and pulls in gtag, jsdelivr and
    # Google Translate, so a useful policy needs to be worked out separately
    # rather than guessed at.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # burst absorbs a normal page load; nodelay serves the burst immediately
    # instead of queueing it. A page pulls five or six /api calls at once.
    location /api/ {
        limit_req zone=ratehubfx_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ratehubfx-proxy.conf;
    }

    location /contact {
        limit_req zone=ratehubfx_contact burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ratehubfx-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/ratehubfx-proxy.conf;
    }
}
