# ratehubfx.com served by the ASTRO site (ports 5003/5004).
#
# ############################################################################
# # ONLY ONE OF THESE TWO MAY BE ENABLED AT A TIME:                          #
# #   /etc/nginx/sites-enabled/exchangehub.conf        -> Flask, 5001/5002   #
# #   /etc/nginx/sites-enabled/exchangehub-astro.conf  -> Astro, 5003/5004   #
# # They share a server_name, so with both enabled nginx warns about a       #
# # conflicting server name and silently serves whichever it loaded first.   #
# ############################################################################
#
# Switching is therefore a symlink swap plus a reload — no redeploy, no
# rebuild, seconds not minutes, and the other stack stays up the whole time:
#
#   # to Astro
#   sudo rm -f /etc/nginx/sites-enabled/exchangehub.conf
#   sudo ln -sf /etc/nginx/sites-available/exchangehub-astro.conf \
#               /etc/nginx/sites-enabled/exchangehub-astro.conf
#   sudo nginx -t && sudo nginx -s reload
#
#   # back to Flask
#   sudo rm -f /etc/nginx/sites-enabled/exchangehub-astro.conf
#   sudo ln -sf /etc/nginx/sites-available/exchangehub.conf \
#               /etc/nginx/sites-enabled/exchangehub.conf
#   sudo nginx -t && sudo nginx -s reload
#
# Like its Flask counterpart this file is NOT deployed by pushing. Copy it to
# the VPS by hand. What the deploy does rewrite is only
# conf.d/exchangehub-astro-upstream.conf, the blue/green port.
#
# The include stays commented: Ubuntu's nginx.conf already globs
# /etc/nginx/conf.d/*.conf, so including the upstream here too is a fatal
# duplicate at `nginx -t`.
#include /etc/nginx/conf.d/exchangehub-astro-upstream.conf;

# Same format as the Flask vhost so one log parser reads both. Only one of the
# two vhosts is ever enabled, so they can share the file without interleaving.
log_format ratehubfx_astro '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                           'host=$host rt=$request_time urt=$upstream_response_time';

# Keyed on the client address, so only meaningful after
# deploy/cloudflare-realip.sh has run. /contact sends mail, so it is the
# expensive path worth protecting.
limit_req_zone $binary_remote_addr zone=ratehubfx_astro_contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ratehubfx_astro_api:10m rate=300r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ratehubfx.com www.ratehubfx.com;

    access_log /var/log/nginx/ratehubfx.access.log ratehubfx_astro;
    error_log  /var/log/nginx/ratehubfx.error.log warn;

    return 301 https://$host$request_uri;
}

server {
    # http2 is a property of the listen socket, so this must match what the
    # alogweb vhost declares for the same port. nginx here is 1.24; on 1.25.1+
    # both move to `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ratehubfx.com www.ratehubfx.com;

    access_log /var/log/nginx/ratehubfx.access.log ratehubfx_astro;
    error_log  /var/log/nginx/ratehubfx.error.log warn;

    # The same Cloudflare Origin Certificate the Flask vhost uses — same zone,
    # same names, so there is nothing to reissue when switching.
    ssl_certificate     /etc/ssl/cloudflare/ratehubfx.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ratehubfx.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ratehubfx_astro:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls, off by default exactly as in the Flask vhost.
    # Enable it in the dashboard FIRST, fetch the CA, then uncomment both —
    # the other order answers every request with 400.
    #ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    #ssl_verify_client      on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html is always gzipped when gzip is on and is not listed here.
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # Astro's own bundle is content-hashed, so it can be cached forever.
    location /_astro/ {
        include /etc/nginx/snippets/ratehubfx-astro-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The flag icons and logos are served by the Node adapter's static handler,
    # which stamps max-age=0 on everything outside /_astro/ -- so a home page
    # with two dozen flags on it revalidated two dozen files per visit. That
    # handler runs before the app's own middleware, so the header is corrected
    # here. A year is safe: these change only by editing the file, which is a
    # deploy. If one must change mid-release, rename it.
    location ~* ^/(flags/|favicon|apple-touch-icon|ratehub-|og-image).*\.(svg|png|ico|jpg|jpeg|webp|avif)$ {
        include /etc/nginx/snippets/ratehubfx-astro-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same handler, same problem as the flags above: without this the faces
    # revalidate on every navigation, which defeats the point of moving them
    # off fonts.gstatic.com. woff2 is already compressed, so it is deliberately
    # absent from gzip_types -- re-compressing it only costs CPU.
    location ~* ^/fonts/.*\.woff2$ {
        include /etc/nginx/snippets/ratehubfx-astro-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # burst absorbs a normal page load; nodelay serves it immediately rather
    # than queueing. A page pulls several /api calls at once.
    location /api/ {
        limit_req zone=ratehubfx_astro_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ratehubfx-astro-proxy.conf;
    }

    location /contact {
        limit_req zone=ratehubfx_astro_contact burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ratehubfx-astro-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/ratehubfx-astro-proxy.conf;
    }
}
