# Shared by every location in the ratehubfx ASTRO vhost, so the locations
# cannot drift apart. Install to /etc/nginx/snippets/ratehubfx-astro-proxy.conf
#
# The upstream block itself is written by scripts/write_upstream.sh into
# /etc/nginx/conf.d/exchangehub-astro-upstream.conf, by a deploy or by
# scripts/switch_color.sh. It holds the live colour plus the idle one as
# `backup`.

proxy_pass http://exchangehub_astro_backend;
proxy_http_version 1.1;

# X-Forwarded-Proto is not decoration here: the app builds every canonical,
# og:url and sitemap entry from it when SITE_URL is unset (src/lib/site.ts),
# and it decides whether the contact form's cookie gets the Secure flag.
# Host must be $host, not $proxy_host, for the same reason.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The app reads this to pick the visitor's language and currency on first
# render. Cloudflare sets it; passing it through is what makes that work.
proxy_set_header CF-IPCountry      $http_cf_ipcountry;

proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# What makes the upstream's `backup` server actually get used. Without this the
# defaults (error timeout) already cover a container that is gone or hung, but
# not one that is up and answering 502/503/504 -- which is what a Node process
# mid-crash or out of memory tends to do.
#
# `non_idempotent` is deliberately absent, so nginx will not pass a POST to the
# backup once it has been sent: the contact form must not be able to send its
# mail twice because the first attempt died after accepting the request.
#
# The tries cap is the number of servers, so a request is attempted on the live
# colour and then at most on the backup, never in a loop.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 15s;
