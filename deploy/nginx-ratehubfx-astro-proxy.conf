# Shared by every location in the ratehubfx ASTRO vhost, so the locations
# cannot drift apart. Install to /etc/nginx/snippets/ratehubfx-astro-proxy.conf
#
# Identical to ratehubfx-proxy.conf except for the upstream it names: that one
# points at the Flask app on 5001/5002, this one at the Astro site on
# 5003/5004. Two upstreams, two snippets, two vhosts — which is what lets both
# stacks run at once and makes switching a vhost swap rather than a redeploy.
#
# The upstream block itself is written by scripts/deploy_astro.sh into
# /etc/nginx/conf.d/exchangehub-astro-upstream.conf on every deploy.

proxy_pass http://exchangehub_astro_backend;
proxy_http_version 1.1;

# X-Forwarded-Proto is not decoration here: the app builds every canonical,
# og:url and sitemap entry from it when SITE_URL is unset (src/lib/site.ts),
# and it decides whether the contact form's cookie gets the Secure flag.
# Host must be $host, not $proxy_host, for the same reason.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# The app reads this to pick the visitor's language and currency on first
# render. Cloudflare sets it; passing it through is what makes that work.
proxy_set_header CF-IPCountry      $http_cf_ipcountry;

proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
