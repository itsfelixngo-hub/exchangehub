name: Deploy

# Deploys the Astro site from `main`, which is the only deploy branch. It used
# to be one of two: `main` carried the Flask app and `astro` carried this
# workflow, and pushing a branch was how you chose which one production served.
# The cutover is done — main was fast-forwarded onto the Astro tree and the
# Flask app deleted, so there is nothing left to switch between. The Flask
# rollback is the `flask-final` tag, not a branch.
#
# The concurrency group keeps two deploys from interleaving over the one
# APP_DIR checkout they share.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The rate fetcher is all the Python there is, so that is what gets
      # checked — even though a deploy does not rebuild it by default.
      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import the fetcher
        env:
          R2_ENABLED: 'false'
        run: python -c "from modules.exchange_rates.fetch_rates import main"

      - name: Build the fetcher image
        run: docker build -f Dockerfile.fetcher --tag exchangehub:ci .

  # The web tier is the Astro app, so nothing reaches production until it
  # builds, typechecks and passes its own smoke test.
  verify-astro:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build and smoke test
        run: |
          npm run check
          npm run build
          npm run smoke

  deploy:
    needs: [verify, verify-astro]
    # Self-hosted runner installed on the production VPS.
    runs-on: [self-hosted, linux, exchangehub]
    timeout-minutes: 30

    steps:
      - name: Deploy on production runner
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'exchangehub' }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/deploy/apps/exchangehub' }}
          # 5003/5004 rather than 5001/5002: the ports were picked so the Astro
          # stack could run beside the Flask one during the cutover. Nothing
          # holds the old pair now, but renumbering would mean editing the
          # vhost, the upstream file and the secrets for no gain.
          ASTRO_BLUE_PORT: ${{ secrets.ASTRO_BLUE_PORT || '5003' }}
          ASTRO_GREEN_PORT: ${{ secrets.ASTRO_GREEN_PORT || '5004' }}
          NGINX_UPSTREAM_CONF: ${{ secrets.NGINX_ASTRO_UPSTREAM_CONF || '/etc/nginx/conf.d/exchangehub-astro-upstream.conf' }}
          # The whole production .env, which the app reads from the repo root
          # (src/lib/env.ts). The fetcher reads the same file.
          PROD_ENV: ${{ secrets.PROD_ENV }}
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_GIT_FETCH: 'true'
          # The code the runner checks out. Only `main` now — see the header.
          DEPLOY_BRANCH: main
          # Set the repository variable SWITCH_NGINX to 'false' to stage the
          # Astro container on the idle port without moving traffic onto it.
          # Worth it for a risky change: /healthz reads no rate data, so only a
          # real page request proves the container can reach R2. Verify, then
          # set it back to 'true' (or delete the variable) and re-run Deploy.
          SWITCH_NGINX: ${{ vars.SWITCH_NGINX || 'true' }}
          # Off, so an ordinary deploy replaces the web tier and nothing else.
          # The fetcher and the mailserver are one long-lived container each,
          # and deploy_fetcher_mail.sh recreates rather than reloads them:
          # restarting the fetcher costs an extra OpenExchangeRates call,
          # because fetch_entrypoint.sh fetches immediately and only then
          # sleeps. Mail would drop connections for the same nothing.
          #
          # Nothing else deploys them any more, so the fetcher keeps running on
          # the image it was last built from — including across this cutover,
          # which is deliberate. To pick up a change to fetch_rates.py, set the
          # repository variable DEPLOY_FETCHER_MAIL to 'true' for one run and
          # then set it back.
          DEPLOY_FETCHER_MAIL: ${{ vars.DEPLOY_FETCHER_MAIL || 'false' }}
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          test -n "$GITHUB_TOKEN"
          test -n "$GITHUB_REPOSITORY"
          GIT_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # APP_DIR is a long-lived checkout, so it is reset rather than cloned.
          # Safe for the fetcher and the mailserver: neither bind-mounts it.
          # The fetcher's code lives in its image and only .deploy-state (the
          # OpenExchangeRates quota state) and docker-data/ are mounted, both
          # gitignored and therefore untracked — a reset never touches them.
          git -c http.extraheader="AUTHORIZATION: basic $GIT_AUTH" \
            fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"

          printf '%s\n' "$PROD_ENV" > .env

          chmod +x scripts/deploy_fetcher_mail.sh scripts/deploy_astro.sh \
                   scripts/write_upstream.sh scripts/switch_color.sh

          export APP_NAME APP_DIR ASTRO_BLUE_PORT ASTRO_GREEN_PORT NGINX_UPSTREAM_CONF
          export BRANCH="$DEPLOY_BRANCH"
          export SKIP_GIT_FETCH
          export SWITCH_NGINX

          # Mailserver and the single fetcher container. Neither is the
          # website, and neither touches the blue/green ports. Off by default,
          # so the usual run only prints what is already up.
          if [ "$DEPLOY_FETCHER_MAIL" = "true" ]; then
            scripts/deploy_fetcher_mail.sh
          else
            echo "Skipping the mailserver and fetcher (DEPLOY_FETCHER_MAIL is not 'true')."
            echo "They keep running untouched; this deploy only replaces the web tier."
            docker ps --filter "name=${APP_NAME}-fetcher" --filter "name=${APP_NAME}-mailserver" \
              --format '  {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          fi

          # Then the web tier: build, health-check and warm the new container,
          # switch nginx onto it, and only then remove the one it replaces.
          scripts/deploy_astro.sh

          # What this deploy put on the ports, and which vhost is enabled. The
          # vhost is still a file on the server copied by hand from
          # deploy/nginx-exchangehub-astro.conf, so a change to that file in the
          # repo does not reach production until someone copies it.
          astro_color="$(cat .deploy-active-color-astro 2>/dev/null || echo blue)"
          if [ "$astro_color" = "blue" ]; then
            astro_port="$ASTRO_BLUE_PORT"
          else
            astro_port="$ASTRO_GREEN_PORT"
          fi
          echo "Astro is on ${astro_color} (127.0.0.1:${astro_port}):"
          curl -fsS "http://127.0.0.1:${astro_port}/healthz"
          echo
          echo "The enabled nginx vhost:"
          ls -l /etc/nginx/sites-enabled/ | grep -i exchangehub || true
