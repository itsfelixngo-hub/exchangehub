name: Deploy

# This file exists on the `astro` branch and deploys the Astro app. The copy on
# `main` is untouched and deploys the Flask app. The branch is the switch:
# whichever one you push (or dispatch) last is what production runs, because
# both reset the same APP_DIR checkout and both write the same nginx upstream.
#
# The concurrency group below is shared with main's workflow on purpose, so a
# push to each branch at the same time cannot have the two deploys interleave.
on:
  push:
    branches:
      - astro
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The Flask web app is gone from this branch; what is left of the Python
      # is the rate fetcher, so that is what gets checked.
      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import the fetcher
        env:
          R2_ENABLED: 'false'
        run: python -c "from modules.exchange_rates.fetch_rates import main"

      - name: Build the fetcher image
        run: docker build -f Dockerfile.fetcher --tag exchangehub:ci .

  # The web tier is the Astro app, so nothing reaches production until it
  # builds, typechecks and passes its own smoke test.
  verify-astro:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build and smoke test
        run: |
          npm run check
          npm run build
          npm run smoke

  deploy:
    needs: [verify, verify-astro]
    # Self-hosted runner installed on the production VPS.
    runs-on: [self-hosted, linux, exchangehub]
    timeout-minutes: 30

    steps:
      - name: Deploy on production runner
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'exchangehub' }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/deploy/apps/exchangehub' }}
          # The Astro site's own ports and its own upstream file — separate
          # from the Flask app's 5001/5002 so both stacks can run at once and
          # switching is a vhost swap rather than a redeploy.
          ASTRO_BLUE_PORT: ${{ secrets.ASTRO_BLUE_PORT || '5003' }}
          ASTRO_GREEN_PORT: ${{ secrets.ASTRO_GREEN_PORT || '5004' }}
          NGINX_UPSTREAM_CONF: ${{ secrets.NGINX_ASTRO_UPSTREAM_CONF || '/etc/nginx/conf.d/exchangehub-astro-upstream.conf' }}
          # One secret for both stacks — the Astro app reads this same .env
          # (src/lib/env.ts reads the repo-root file), so nothing
          # new has to be stored for the cutover.
          PROD_ENV: ${{ secrets.PROD_ENV }}
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_GIT_FETCH: 'true'
          # The branch this workflow file lives on, and therefore the code the
          # runner checks out. There is no WEB_STACK switch: pushing or
          # dispatching `main` runs main's own workflow and puts the Flask app
          # back, which is the rollback.
          DEPLOY_BRANCH: astro
          # Set the repository variable SWITCH_NGINX to 'false' to stage the
          # Astro container on the idle port without moving traffic onto it.
          # Use it for the first cutover: /healthz reads no rate data, so only
          # a real page request proves the container can reach R2. Verify, then
          # set it back to 'true' (or delete the variable) and re-run Deploy.
          SWITCH_NGINX: ${{ vars.SWITCH_NGINX || 'true' }}
          # The mailserver and the fetcher are shared by both stacks — one
          # container name each, whichever deploy ran last owns it. During the
          # cutover main still deploys them, and recreating them from here
          # would restart the fetcher and interrupt mail for no reason: this
          # branch changes only the web tier. So it defaults to off.
          #
          # Set the repository variable DEPLOY_FETCHER_MAIL to 'true' once main
          # is retired — after that nothing else deploys them, and leaving this
          # off means the fetcher keeps running forever on whatever image main
          # last built.
          DEPLOY_FETCHER_MAIL: ${{ vars.DEPLOY_FETCHER_MAIL || 'false' }}
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          test -n "$GITHUB_TOKEN"
          test -n "$GITHUB_REPOSITORY"
          GIT_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # APP_DIR is one checkout shared with main's workflow, so this resets
          # it onto the Astro branch. Deploying main later resets it back —
          # that is exactly how the rollback works.
          git -c http.extraheader="AUTHORIZATION: basic $GIT_AUTH" \
            fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"

          printf '%s\n' "$PROD_ENV" > .env

          chmod +x scripts/deploy_fetcher_mail.sh scripts/deploy_astro.sh

          export APP_NAME APP_DIR ASTRO_BLUE_PORT ASTRO_GREEN_PORT NGINX_UPSTREAM_CONF
          export BRANCH="$DEPLOY_BRANCH"
          export SKIP_GIT_FETCH
          export SWITCH_NGINX

          # Mailserver and the single fetcher container. Neither is the
          # website, and neither touches the blue/green ports.
          if [ "$DEPLOY_FETCHER_MAIL" = "true" ]; then
            scripts/deploy_fetcher_mail.sh
          else
            echo "Skipping the mailserver and fetcher (DEPLOY_FETCHER_MAIL is not 'true')."
            echo "They keep running as main's deploy left them; this deploy only replaces the web tier."
            docker ps --filter "name=${APP_NAME}-fetcher" --filter "name=${APP_NAME}-mailserver" \
              --format '  {{.Names}}\t{{.Image}}\t{{.Status}}' || true
          fi

          # Then the web tier: build, health-check and warm the new Astro
          # container, switch nginx onto it, and only then remove the old Astro
          # container and any Flask web container it supersedes.
          scripts/deploy_astro.sh

          # What this deploy put on the Astro ports. It does NOT prove the
          # site is serving it: which stack visitors reach is decided by which
          # vhost is enabled in /etc/nginx/sites-enabled, and that is a manual
          # symlink swap (see deploy/nginx-exchangehub-astro.conf). Deploying
          # never takes traffic away from the old site on its own.
          astro_color="$(cat .deploy-active-color-astro 2>/dev/null || echo blue)"
          if [ "$astro_color" = "blue" ]; then
            astro_port="$ASTRO_BLUE_PORT"
          else
            astro_port="$ASTRO_GREEN_PORT"
          fi
          echo "Astro is on ${astro_color} (127.0.0.1:${astro_port}):"
          curl -fsS "http://127.0.0.1:${astro_port}/healthz"
          echo
          echo "Whether visitors see it depends on the enabled nginx vhost:"
          ls -l /etc/nginx/sites-enabled/ | grep -i exchangehub || true
