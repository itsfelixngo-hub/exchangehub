name: Deploy

# This file exists on the `astro` branch and deploys the Astro app. The copy on
# `main` is untouched and deploys the Flask app. The branch is the switch:
# whichever one you push (or dispatch) last is what production runs, because
# both reset the same APP_DIR checkout and both write the same nginx upstream.
#
# The concurrency group below is shared with main's workflow on purpose, so a
# push to each branch at the same time cannot have the two deploys interleave.
on:
  push:
    branches:
      - astro
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources and smoke test
        env:
          FLASK_SECRET_KEY: ci-only-secret
          LOCAL_STORAGE_ENABLED: 'false'
          R2_ENABLED: 'false'
        run: |
          python -m compileall -q .
          python - <<'PY'
          from app import app

          with app.test_client() as client:
              response = client.get('/healthz')
              assert response.status_code == 200, response.text
          PY

      - name: Build Docker image
        run: docker build --tag exchangehub:ci .

  # The web tier is the Astro app, so nothing reaches production until it
  # builds, typechecks and passes its own smoke test.
  verify-astro:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro-web/package-lock.json

      - name: Install dependencies
        working-directory: astro-web
        run: npm ci

      - name: Typecheck, build and smoke test
        working-directory: astro-web
        run: |
          npm run check
          npm run build
          npm run smoke

  deploy:
    needs: [verify, verify-astro]
    # Self-hosted runner installed on the production VPS.
    runs-on: [self-hosted, linux, exchangehub]
    timeout-minutes: 30

    steps:
      - name: Deploy on production runner
        env:
          APP_NAME: ${{ secrets.APP_NAME || 'exchangehub' }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/deploy/apps/exchangehub' }}
          BLUE_PORT: ${{ secrets.BLUE_PORT || '5001' }}
          GREEN_PORT: ${{ secrets.GREEN_PORT || '5002' }}
          NGINX_UPSTREAM_CONF: ${{ secrets.NGINX_UPSTREAM_CONF || '/etc/nginx/conf.d/exchangehub-upstream.conf' }}
          # One secret for both stacks — the Astro app reads this same .env
          # (astro-web/src/lib/env.ts walks up to the repo root), so nothing
          # new has to be stored for the cutover.
          PROD_ENV: ${{ secrets.PROD_ENV }}
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_GIT_FETCH: 'true'
          # The branch this workflow file lives on, and therefore the code the
          # runner checks out. There is no WEB_STACK switch: pushing or
          # dispatching `main` runs main's own workflow and puts the Flask app
          # back, which is the rollback.
          DEPLOY_BRANCH: astro
          # Set the repository variable SWITCH_NGINX to 'false' to stage the
          # Astro container on the idle port without moving traffic onto it.
          # Use it for the first cutover: /healthz reads no rate data, so only
          # a real page request proves the container can reach R2. Verify, then
          # set it back to 'true' (or delete the variable) and re-run Deploy.
          SWITCH_NGINX: ${{ vars.SWITCH_NGINX || 'true' }}
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          test -n "$GITHUB_TOKEN"
          test -n "$GITHUB_REPOSITORY"
          GIT_AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # APP_DIR is one checkout shared with main's workflow, so this resets
          # it onto the Astro branch. Deploying main later resets it back —
          # that is exactly how the rollback works.
          git -c http.extraheader="AUTHORIZATION: basic $GIT_AUTH" \
            fetch --force "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"

          printf '%s\n' "$PROD_ENV" > .env

          chmod +x scripts/deploy_blue_green.sh scripts/deploy_astro.sh

          # Shared by both scripts, so the two cannot disagree about which
          # ports and which nginx upstream file they are switching.
          export APP_NAME APP_DIR BLUE_PORT GREEN_PORT NGINX_UPSTREAM_CONF
          export BRANCH="$DEPLOY_BRANCH"
          export SKIP_GIT_FETCH
          export SWITCH_NGINX

          # Mailserver and fetcher only. DEPLOY_WEB=false because the web tier
          # is the Astro app — the step below owns the blue/green ports and the
          # nginx upstream, and this script would otherwise claim both for a
          # gunicorn container.
          DEPLOY_WEB=false scripts/deploy_blue_green.sh

          # Then the web tier: build, health-check and warm the new Astro
          # container, switch nginx onto it, and only then remove the old Astro
          # container and any Flask web container it supersedes.
          scripts/deploy_astro.sh

          # Report what is actually serving, rather than what we meant to
          # deploy. `version` is baked into each image (1 = Flask, 2 = Astro),
          # so this line is the switch's own receipt in the job log. With
          # SWITCH_NGINX=false this deliberately still reports the OLD stack —
          # that is the point: nothing moved, and the log should say so.
          active_color="$(cat .deploy-active-color 2>/dev/null || echo blue)"
          if [ "$active_color" = "blue" ]; then
            active_port="$BLUE_PORT"
          else
            active_port="$GREEN_PORT"
          fi
          echo "Live now (${active_color} on ${active_port}):"
          curl -fsS "http://127.0.0.1:${active_port}/healthz"
          echo
