name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      # The Flask web app is gone from this branch; the Python that is left is
      # the rate fetcher, so that is what gets imported.
      - name: Import the fetcher
        env:
          R2_ENABLED: 'false'
        run: python -c "from modules.exchange_rates.fetch_rates import main"

      - name: Validate deployment shell scripts
        run: bash -n scripts/*.sh fetch_entrypoint.sh modules/exchange_rates/*.sh

  # The Astro app is what nginx serves; the Python job above covers the rate
  # fetcher and the scripts. Independent of `test`, so a break in either half
  # is reported on its own rather than hidden behind the other.
  astro:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json and the base image in
          # Dockerfile; Astro 7 refuses to run on Node 20.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # Boots the built server against fixture rate files and asserts on the
      # routes, the canonical URLs, the cache headers and the contact form.
      # No credentials needed: R2 is off and the fixtures are written to a
      # temp directory by the script itself.
      - name: Smoke test
        run: npm run smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, astro]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fetcher image
        run: docker build -f Dockerfile.fetcher --tag exchangehub:ci .

      - name: Build Astro image
        run: docker build --tag exchangehub-astro:ci .

      # Proves the runtime stage can actually serve, not just that it built —
      # a missing production dependency only shows up when the server starts.
      - name: Run Astro image
        run: |
          docker run -d --name astro-ci -p 127.0.0.1:5003:5003 \
            -e R2_ENABLED=false -e SITE_URL=https://ci.example \
            exchangehub-astro:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5003/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5003/healthz | grep -q '"version":2'
          docker rm -f astro-ci
